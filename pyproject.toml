[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop_client"
version = "0.1.0"
description = "PySide6 Live Overlay with Microphone Capture and Windows Capture Exclusion"
authors = [{ name = "Desktop Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "qasync>=0.27.0",
    "sounddevice>=0.4.6",
    "SoundCard>=0.4.6",
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
build = [
    "pyinstaller>=6.22",
]

[project.scripts]
desktop-client = "desktop_client.main:main"

[tool.setuptools.packages.find]
include = ["desktop_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires a running backend and DESKTOP_LIVE_TOKEN"]
